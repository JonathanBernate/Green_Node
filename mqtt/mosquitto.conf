# Demo local GreenNode — sin TLS, acceso anónimo (Req 1.1, 1.2)

# Listener MQTT nativo (TCP) — usado por el simulador Python y la app RN
listener 1883 0.0.0.0
protocol mqtt

# Listener WebSocket — usado por el dashboard web (navegador)
listener 9001 0.0.0.0
protocol websockets

allow_anonymous true

# Persistencia desactivada: la demo no necesita retener estado entre arranques
persistence false

# Logs a stdout para verlos con `docker compose logs -f`
log_dest stdout
log_type all
connection_messages true
